version: "2"
sql:
  - engine: "mysql"
    schema: "db/migrations/000001_initial_schema.up.sql"
    queries: "db/queries"
    gen:
      go:
        package: "sqlc"
        out: "db/generated/sqlc"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "datetime"
            go_type: "time.Time"
          - db_type: "timestamp"
            go_type: "time.Time"
          - db_type: "json"
            go_type: "encoding/json.RawMessage"
            nullable: false
          - db_type: "json"
            go_type: "encoding/json.RawMessage"
            nullable: true
  
