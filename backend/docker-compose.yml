services:
  mysql:
    image: mysql:9.7.3
    container_name: gurimax-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gurimax}
      MYSQL_USER: ${MYSQL_USER:-gurimax_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gurimax_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gurimax_root_dev_password}
      TZ: America/Santo_Domingo
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/migrations/000001_initial_schema.up.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - gurimax_private

volumes:
  mysql_data:

networks:
  gurimax_private:
    driver: bridge
