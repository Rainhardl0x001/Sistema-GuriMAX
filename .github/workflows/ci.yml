name: GuriMAX Basic CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-ci:
    name: Backend API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.0'

    - name: Install dependencies
      run: |
        if [ -s go.mod ]; then
          go mod download
        else
          echo "go.mod no existe o está vacío. Omitiendo dependencias de Go."
        fi

    - name: Run gofmt
      run: |
        if find . -name "*.go" -size +0c | grep -q .; then
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted"
            exit 1
          fi
        else
          echo "No se encontraron archivos .go con contenido. Omitiendo gofmt."
        fi

    - name: Run go vet
      run: |
        if [ -s go.mod ] && find . -name "*.go" -size +0c | grep -q .; then
          go vet ./...
        else
          echo "Proyecto Go no iniciado o con archivos vacíos. Omitiendo go vet."
        fi

    - name: Run Go tests
      run: |
        if [ -s go.mod ] && find . -name "*.go" -size +0c | grep -q .; then
          go test ./...
        else
          echo "Proyecto Go no iniciado o con archivos vacíos. Omitiendo tests."
        fi

  frontend-ci:
    name: Frontend Client (Svelte)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client/frontend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.19.0'

    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: '11.23.0'

    - name: Install dependencies
      run: |
        if [ -s package.json ]; then
          pnpm install --frozen-lockfile
        else
          echo "package.json no existe o está vacío. Omitiendo pnpm install."
        fi

    - name: Run ESLint
      run: |
        if [ -s package.json ]; then
          pnpm run lint
        else
          echo "package.json no existe o está vacío. Omitiendo ESLint."
        fi

    - name: Run Vitest
      run: |
        if [ -s package.json ]; then
          pnpm run test
        else
          echo "package.json no existe o está vacío. Omitiendo Vitest."
        fi
